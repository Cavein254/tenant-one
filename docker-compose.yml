services:
    mariadb:
      image: mariadb: 10.6
      enviroment:
        MARIADB_ROOT_PASSWORD: supersecret
        MARIADB_DATABASE: tenants
        MARIADB_USER: myuser
        MARIADB_PASSWORD: mysuperpassword
      volumes:
        - mariadb_data: /var/lib/mysql
      ports:
        -"3306:3306"
      restart: unless-stopped

volumes:
  mariadb_data:
